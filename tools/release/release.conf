# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; build.sh, check_deps.py,
# licenses.sh, manifest.py and selfcheck.py stay generic.
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-arpeggiator
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.arpeggiator
PACKAGE_NAME="Oscairn Arpeggiator"
PACKAGE_SUMMARY="Oscairn's MIDI arpeggiator (a note effect), with Montage-style phrases, recording and tempo sync."
# SPDX expression, as published in the packages repo:
LICENSE=MIT
# synth | effect | note-effect:
PLUGIN_KIND=note-effect
# The plugin's own version lives in its clap_plugin_descriptor_t in this file:
PLUGIN_VERSION_FILE=src/plugin.cpp
SOURCE_URL=https://github.com/oscairn/arpeggiator
# Releases are tagged oscairn-vX.Y.Z (upstream v* tags exist in forks):
TAG_PREFIX=oscairn-
# CMake target producing the .clap:
CLAP_TARGET=oscairn-arpeggiator
CLAP_VERSION_FILE=third_party/clap/include/clap/version.h
OSCAIRN_CLAP_UPSTREAM=third_party/oscairn-clap/upstream.json
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>:
LICENSE_FILES="LICENSE=arpeggiator-LICENSE third_party/clap/LICENSE=clap-LICENSE third_party/oscairn-clap/LICENSE=oscairn-clap-LICENSE"
